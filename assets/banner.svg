<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="peter-mdf — smart home tinkerer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#334155" stroke-width="1" opacity=".45"/>
    </pattern>
  </defs>

  <rect width="1200" height="260" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="16" fill="url(#grid)"/>

  <!-- route line: parcel travelling to a house -->
  <path d="M866 178 C 920 178, 935 112, 985 112 S 1035 150, 1062 150" fill="none" stroke="url(#accent)" stroke-width="3" stroke-dasharray="8 10" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="36" to="0" dur="1.6s" repeatCount="indefinite"/>
  </path>

  <!-- parcel -->
  <g transform="translate(806 146)">
    <path d="M0 14 L30 0 L60 14 L30 28 Z" fill="#fbbf24"/>
    <path d="M0 14 L30 28 L30 62 L0 48 Z" fill="#d97706"/>
    <path d="M60 14 L30 28 L30 62 L60 48 Z" fill="#f59e0b"/>
    <path d="M15 7 L45 21 L45 34" fill="none" stroke="#78350f" stroke-width="3" opacity=".5"/>
  </g>

  <!-- house -->
  <g transform="translate(1060 96)">
    <path d="M0 40 L45 4 L90 40" fill="none" stroke="#e2e8f0" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
    <rect x="12" y="38" width="66" height="54" rx="4" fill="none" stroke="#e2e8f0" stroke-width="6"/>
    <circle cx="45" cy="64" r="9" fill="#34d399">
      <animate attributeName="opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="64" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#f8fafc">peter-mdf</text>
  <rect x="66" y="138" width="120" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="64" y="186" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#94a3b8">Home Assistant integrations · smart home tinkering · open source</text>
</svg>
